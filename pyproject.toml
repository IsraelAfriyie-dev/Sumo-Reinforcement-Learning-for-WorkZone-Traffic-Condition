[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo-workzone-rl"
version = "1.0.0"
description = "Deep Q-Network reinforcement learning for SUMO work zone traffic control"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Israel Afriyie"}
]
keywords = [
    "reinforcement-learning",
    "deep-q-network",
    "dqn",
    "sumo",
    "traffic-control",
    "work-zone",
    "traffic-simulation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.0.0",
    "sumolib>=1.18.0",
    "gymnasium>=0.28.0",
    "pyyaml>=6.0",
    "tensorboard>=2.12.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
gpu = [
    "torch>=2.0.0+cu118",
]

[project.scripts]
train-dqn = "training.train_dqn:main"
evaluate-policy = "evaluation.evaluate_policy:main"

[project.urls]
Homepage = "https://github.com/IsraelAfriyie-dev/Sumo-Reinforcement-Learning-for-WorkZone-Traffic-Condition"
Documentation = "https://github.com/IsraelAfriyie-dev/Sumo-Reinforcement-Learning-for-WorkZone-Traffic-Condition/blob/sumo-dqn-workzone-cleanup/docs/README.md"
Repository = "https://github.com/IsraelAfriyie-dev/Sumo-Reinforcement-Learning-for-WorkZone-Traffic-Condition"
Issues = "https://github.com/IsraelAfriyie-dev/Sumo-Reinforcement-Learning-for-WorkZone-Traffic-Condition/issues"

[tool.setuptools]
packages = ["envs", "agents", "training", "evaluation"]

[tool.setuptools.package-data]
"* = ["*.yaml", "*.xml", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["envs", "agents", "training", "evaluation"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]